<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing Page — Desktop e Mobile</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: start;
      gap: 24px;
      background: #181818;
      color: #fcf7f7;
      font: 12px "JetBrains Mono", monospace;
    }
    section { display: grid; gap: 12px; }
    h2 { margin: 0; font-size: 12px; text-transform: uppercase; }
    iframe { border: 1px solid rgb(252 247 247 / 16%); background: #181818; }
  </style>
</head>
<body>
  <section>
    <h2>Desktop / 1440</h2>
    <iframe src="./wireframe.html" width="1440" height="900" title="Wireframe desktop"></iframe>
  </section>
  <section>
    <h2>Mobile / 390</h2>
    <iframe src="./wireframe.html" width="390" height="844" title="Wireframe mobile"></iframe>
  </section>
</body>
</html>
